<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="數字積木屋：以立體十進位積木、跳數列車、直式加減與九九乘法互動教具，幫助國小學童動手理解數學概念。">
<title>數字積木屋｜國小數學概念探索與運算思維教室</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@500;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">

<!-- iOS / iPadOS 加入主畫面 (Apple Touch Icon & Web Clip) -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="數字積木屋">

<!-- 標準 Favicon & PWA Web App Manifest -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="manifest" href="site.webmanifest">
<meta name="application-name" content="數字積木屋">
<meta name="theme-color" content="#2563eb">
</head>
<body>

<!-- 全域 SVG 漸層與濾鏡定義庫（常駐於 DOM 根部，確保跨分頁切換時漸層永不失效） -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;" aria-hidden="true">
  <defs>
    <!-- 個位小立方體漸層 (課本白色/淺灰色教具積木) -->
    <linearGradient id="svg-grad-o-top" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="svg-grad-o-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="svg-grad-o-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- 個位相容圓球漸層 (備用) -->
    <radialGradient id="svg-grad-o" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- 十位立體長條棒漸層 (課本暖橘色，頂、前、側三面) -->
    <linearGradient id="svg-grad-t-top" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="svg-grad-t-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="svg-grad-t-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="svg-grad-t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- 百位立體方板漸層 (課本水藍色，頂、前、側三面) -->
    <linearGradient id="svg-grad-h-top" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="svg-grad-h-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="svg-grad-h-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="svg-grad-h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="20%" stop-color="#60a5fa"/>
      <stop offset="75%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 千位大立方體漸層 -->
    <linearGradient id="svg-grad-th-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="svg-grad-th-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="svg-grad-th-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>
</svg>

<!-- 頂部全站導航列 (SITE HEADER) -->
<header class="site-header-hub" id="site-header-hub">
  <div class="hub-inner">
    <div class="hub-brand">
      <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect class="brand-mark-h" x="3" y="10" width="15" height="15" rx="3.5" />
        <rect class="brand-mark-t" x="15" y="4" width="7" height="16" rx="2.5" />
        <rect class="brand-mark-o" x="19" y="18" width="10" height="10" rx="3" />
      </svg>
      <h1 id="main-title">數字積木屋</h1>
    </div>

    <!-- 主模組單元導覽列 (各學習單元入口) -->
    <nav class="main-nav-tabs" role="tablist" aria-label="學習單元切換">
      <button class="main-tab active" id="main-tab-learn" type="button" role="tab" aria-selected="true" aria-controls="panel-learn">
        <span data-lucide="lightbulb" aria-hidden="true"></span><span>位值探索</span>
      </button>
      <button class="main-tab" id="main-tab-seq" type="button" role="tab" aria-selected="false" aria-controls="panel-seq">
        <span data-lucide="sparkles" aria-hidden="true"></span><span>規律與跳數</span>
      </button>
      <button class="main-tab" id="main-tab-calc" type="button" role="tab" aria-selected="false" aria-controls="panel-calc">
        <span data-lucide="calculator" aria-hidden="true"></span><span>直式加減法</span>
      </button>
      <button class="main-tab" id="main-tab-mul" type="button" role="tab" aria-selected="false" aria-controls="panel-mul">
        <span data-lucide="grid" aria-hidden="true"></span><span>九九乘法表</span>
      </button>
    </nav>

    <div class="audio-bar" aria-label="聲音控制">
      <button class="toggle-pill" id="toggle-sound" type="button" aria-pressed="true" title="關閉音效">
        <span data-lucide="volume-2" aria-hidden="true"></span><span class="toggle-label">音效</span>
      </button>
      <button class="toggle-pill" id="toggle-voice" type="button" aria-pressed="true" title="關閉語音">
        <span data-lucide="speech" aria-hidden="true"></span><span class="toggle-label">語音</span>
      </button>
    </div>
  </div>
</header>

<div class="wrap">

<!-- @include partials/panel-learn.html -->

<!-- @include partials/panel-seq.html -->

<!-- @include partials/panel-calc.html -->

<!-- @include partials/panel-mul.html -->

<!-- @include partials/dialogs-quest.html -->

  <footer class="footer-wrap">
    <!-- 頁尾語音狀態卡片（方便在 iPad 或行動裝置即時檢視調用語音） -->
    <div class="voice-status-card" id="voice-status-card">
      <div class="voice-status-main">
        <span class="voice-status-pill"><span data-lucide="speech" aria-hidden="true"></span><span>語音引擎</span></span>
        <span class="voice-status-text">目前調用語音：<strong id="voice-status-name">偵測中…</strong></span>
      </div>
      <div class="voice-status-actions">
        <button class="ghost-btn small voice-test-btn" id="voice-test-btn" type="button" title="點擊試聽此語音">
          <span data-lucide="volume-2" aria-hidden="true"></span><span>試聽語音</span>
        </button>
        <button class="ghost-btn small voice-list-btn" id="open-voice-modal-btn" type="button" title="查看可用語音清單與切換">
          <span data-lucide="list" aria-hidden="true"></span><span>語音清單</span>
        </button>
      </div>
    </div>

    <p>用積木的方式，把數字拆開來看，數學也可以這麼好玩。</p>
    <div class="sys-tools">
      <button class="ghost-btn small diag-trigger-btn" id="open-diagnostics-btn" type="button"><span data-lucide="activity" aria-hidden="true"></span><span>系統自我檢測 (Self-Test)</span></button>
    </div>
  </footer>
</div>

<!-- @include partials/modals-system.html -->

<!-- Vite 應用程式入口 -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
