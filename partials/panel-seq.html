  <!-- ================= 單元 2：數的規律與跳數 (SEQUENCE & SKIP COUNTING) ================= -->

      <section class="seq-card">

            </div>
          </div>

            <div class="seq-block-col col-t">

              <div class="seq-block-container" id="seq-blocks-t"></div>
              <div class="count-tag" id="seq-count-t">0 根十格條</div>

              <div class="count-tag" id="seq-count-o">0 顆小積木</div>

              <button class="chart-range-btn" type="button" data-range="201">201 ~ 300</button>
